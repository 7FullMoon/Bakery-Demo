<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5c4d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>نظام المخبز المحاسبي — نسخة تجريبية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ec;--card:#fff;--tx:#1d2a27;--mu:#66756f;--ac:#1f5c4d;--ac2:#c8963e;--bd:#d6ddd6;--ok:#1f7a4d;--no:#b3372f;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b19;--card:#1e2926;--tx:#e8efeb;--mu:#93a39c;--ac:#5fc3a5;--ac2:#e0b25e;--bd:#2f3d38;--ok:#6fd6a0;--no:#f0847c;--on:#10201b}}
:root[data-theme="dark"]{--bg:#141b19;--card:#1e2926;--tx:#e8efeb;--mu:#93a39c;--ac:#5fc3a5;--ac2:#e0b25e;--bd:#2f3d38;--ok:#6fd6a0;--no:#f0847c;--on:#10201b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.6 Tajawal,Tahoma,Arial,sans-serif}
header{padding:14px 16px 4px;max-width:1040px;margin:auto}
h1{font-size:23px;font-weight:800;margin:0;color:var(--ac)}
header span{color:var(--mu);font-size:13px}
nav{display:flex;gap:2px;overflow-x:auto;padding:6px 16px;max-width:1040px;margin:auto;border-bottom:2px solid var(--bd)}
nav button{background:none;border:0;padding:8px 12px;font:500 15px Tajawal,Tahoma,sans-serif;color:var(--mu);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-8px}
nav button.on{color:var(--ac);border-color:var(--ac);font-weight:700}
main{max-width:1040px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.grid .box{margin:0}
.box h2{font-size:17px;margin:0 0 10px}
.k{color:var(--mu);font-size:13px}.v{font-size:21px;font-weight:800}
.pos{color:var(--ok)}.neg,.warn{color:var(--no)}.warn{font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:10px}
.row label{display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:3px;flex:1;min-width:120px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:7px 9px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:7px;padding:9px 16px;font:700 14px Tajawal,Tahoma,sans-serif;cursor:pointer}
.btn.s{background:none;color:var(--ac);border:1px solid var(--ac);padding:4px 10px}
.btn.d{background:none;color:var(--no);border:1px solid var(--no);padding:4px 10px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:13px}
.empty{color:var(--mu);padding:8px 0}
.tot{font-size:17px;font-weight:800;margin:8px 0}
.tag{font-size:12px;padding:1px 8px;border-radius:9px;border:1px solid var(--bd);color:var(--mu)}
details{margin:2px 0}summary{cursor:pointer;color:var(--ac)}
</style>
</head>
<body>
<header><h1>نظام رياض المحاسبي للمخبز <span style="font-size:13px;background:var(--ac2);color:#1d2a27;border-radius:10px;padding:1px 10px;vertical-align:middle">نسخة تجريبية</span></h1><span>قيد مزدوج — العملة: ريال يمني — بيانات وهمية تُعاد ضبطها دوريًا، فلا تُدخل بيانات حقيقية</span></header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
var TABS=[['dash','الرئيسية'],['je','القيود اليومية'],['vo','سندات القبض والصرف'],['s','المبيعات'],['b','المشتريات'],['par','العملاء والموردون'],['inv','المخزون'],['rep','التقارير والحسابات'],['chk','الشيكات'],['usr','المستخدمون والصلاحيات'],['emp','الموظفون والرواتب'],['wh','المخازن والجرد'],['po','أوامر الشراء والاستلام'],['per','الفترات المحاسبية'],['cur','العملات']];
var ROLES={'مدير':'*','محاسب':'dash,je,vo,s,b,par,inv,rep,chk,emp,wh,po,per,cur','أمين صندوق':'dash,vo,chk,par','مبيعات':'dash,s,par','مشتريات ومخزن':'dash,b,inv,par,wh,po'};
var PM=[['نقدًا','1101'],['تحويل بنكي','1102'],['محفظة إلكترونية','1103']];
var DA=[['1101','الصندوق','a'],['1102','حساب البنك','a'],['1103','المحفظة الإلكترونية','a'],['1201','العملاء','a'],['1301','مخزون المواد الخام','a'],['1302','مخزون المنتجات','a'],['2101','الموردون','l'],['2201','دفعات مقدمة من العملاء','l'],['3101','رأس المال','e'],['4101','إيرادات المبيعات','r'],['4201','إيرادات أخرى','r'],['5101','تكلفة المبيعات','x'],['5201','الرواتب','x'],['5202','الإيجار','x'],['5203','كهرباء ووقود','x'],['5204','مصروفات أخرى','x']];
var VT=[['تحصيل من عميل','in','1201',1],['دفعة مقدمة من عميل','in','2201',1],['إيراد آخر','in','4201',0],['تمويل من المالك','in','3101',0],['سداد مورد','out','2101',1],['مصروف','out','X',0]];
var S={acc:DA.map(function(a){return{c:a[0],n:a[1],t:a[2]}}),ent:[],par:[],itm:[],inv:[],log:[],seq:0,users:[],chk:[],emp:[],pay:[],wh:[],mv:[],per:[],cur:[],po:[]};

var tab='dash',cart={s:[],b:[]},jl=[],stm='',CU=null;
[['1104','شيكات تحت التحصيل','a'],['2102','شيكات مستحقة الدفع','l'],['1205','سلف الموظفين','a'],['2301','رواتب مستحقة','l'],['5205','فروقات وتالف المخزون','x']].forEach(function(a){if(!S.acc.some(function(x){return x.c==a[0]}))S.acc.push({c:a[0],n:a[1],t:a[2]})});S.acc.sort(function(a,b){return a.c<b.c?-1:1});
function save(){}
function $(i){return document.getElementById(i)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function n(x){return Number(x||0).toLocaleString('en',{maximumFractionDigits:2})}
function m(x){return n(x)+' ر.ي'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function val(i){return $(i).value}
function num(i){return parseFloat($(i).value)||0}
function sum(a,f){return a.reduce(function(t,x){return t+f(x)},0)}
function empty(t){return '<div class="empty">'+t+'</div>'}
function B(t,f,i,c){return '<button class="btn '+(c||'s')+'" data-i="'+esc(i)+'" onclick="'+f+'(this.dataset.i)">'+t+'</button>'}
function opts(a,v,l,sel){return a.map(function(x){return '<option value="'+esc(v(x))+'"'+(v(x)==sel?' selected':'')+'>'+esc(l(x))+'</option>'}).join('')}
function accOpts(t,sel){return opts(S.acc.filter(function(a){return!t||t.indexOf(a.t)>=0}),function(a){return a.c},function(a){return a.c+' — '+a.n},sel)}
function pname(id){var p=S.par.find(function(x){return x.id==id});return p?p.n:''}
function log(t){S.log.push({t:new Date().toLocaleString('en-GB'),x:(CU?CU.n+': ':'')+t})}
function bal(c){var t=0;S.ent.forEach(function(e){if(e.st=='مرحّل')e.l.forEach(function(l){if(l.a==c)t+=l.d-l.r})});return t}
function mk(desc,ref,lines,ty,date){var mo=(date||today()).slice(0,7);if(S.per.some(function(p){return p.m==mo&&p.c}))throw new Error('CLOSED:'+mo);var e={id:uid(),no:++S.seq,date:date||today(),ty:ty||'آلي',desc:desc,ref:ref||'',st:'مرحّل',l:lines.filter(function(l){return l[1]||l[2]}).map(function(l){return{a:l[0],d:+l[1]||0,r:+l[2]||0,p:l[3]||'',x:l[4]||''}})};S.ent.push(e);log('قيد رقم '+e.no+': '+desc);return e}
function nav(){$('nav').innerHTML=TABS.filter(function(t){return can(t[0])}).map(function(t){return '<button class="'+(t[0]==tab?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join('')}
function go(t){tab=t;render()}
function can(t){if(!CU)return false;var r=ROLES[CU.role]||'';return r=='*'||r.split(',').indexOf(t)>=0}
function render(){if(!CU){$('nav').innerHTML='';return login()}if(!can(tab))tab='dash';nav();$('nav').insertAdjacentHTML('beforeend','<button onclick="refresh()" style="margin-inline-start:auto">⟳ تحديث</button><button onclick="logout()">خروج — '+esc(CU.n)+'</button>');({dash:dash,je:je,vo:vo,s:function(){invs('s')},b:function(){invs('b')},par:par,inv:inv,rep:rep,chk:chk,usr:usr,emp:emp,wh:wh,po:po,per:per,cur:cur})[tab]()}
function typeSum(t){return sum(S.acc.filter(function(a){return a.t==t}),function(a){return bal(a.c)})}

/* الرئيسية */
function dash(){
 var profit=-typeSum('r')-typeSum('x'),low=S.itm.filter(function(i){return i.q<=i.min});
 var c=[['الصندوق',bal('1101')],['البنك',bal('1102')],['المحفظة الإلكترونية',bal('1103')],['ذمم العملاء',bal('1201')+bal('2201')],['مستحقات الموردين',-bal('2101')],['قيمة المخزون',bal('1301')+bal('1302')],['صافي الربح',profit]];
 $('app').innerHTML='<div class="grid">'+c.map(function(x){return '<div class="box"><div class="k">'+x[0]+'</div><div class="v '+(x[1]<0?'neg':'')+'">'+m(x[1])+'</div></div>'}).join('')+'</div>'+
 '<div class="box"><h2>تنبيهات المخزون</h2>'+(low.length?low.map(function(i){return '<div class="warn">'+esc(i.n)+': المتبقي '+n(i.q)+' '+esc(i.u)+(i.q<=0?' (نفد)':' (وصل لحد إعادة الطلب)')+'</div>'}).join(''):empty('لا توجد أصناف وصلت لحد إعادة الطلب.'))+'</div>'+
 '<div class="box"><h2>ابدأ من هنا</h2><div class="empty">1) سجّل رأس المال من «سندات القبض والصرف» (تمويل من المالك). 2) أضف الأصناف من «المخزون». 3) أضف العملاء والموردين. 4) سجّل المشتريات ثم الإنتاج ثم المبيعات.</div></div>'}

/* القيود اليومية */
function je(){
 if(!jl.length)jl=[{a:'1101',x:'',d:'',r:''},{a:'4201',x:'',d:'',r:''}];
 var L=S.ent.slice().reverse().slice(0,30);
 $('app').innerHTML='<div class="box"><h2>قيد يومي جديد</h2><div class="row"><label>التاريخ<input id="jd" type="date" value="'+today()+'"></label><label style="flex:3">البيان العام<input id="jn"></label></div><div class="tw"><table id="jt"></table></div><div class="row"><button class="btn s" onclick="jl.push({a:\'1101\',x:\'\',d:\'\',r:\'\'});jrows()">+ سطر</button></div><div class="tot" id="jtot"></div><button class="btn" onclick="jsave(false)">حفظ كمسودة</button> <button class="btn" onclick="jsave(true)">حفظ وترحيل</button></div>'+
 '<div class="box"><h2>سجل القيود</h2>'+(L.length?'<div class="tw"><table><tr><th>الرقم</th><th>التاريخ</th><th>النوع</th><th>البيان</th><th>المبلغ</th><th>الحالة</th><th></th></tr>'+L.map(function(e){var t=sum(e.l,function(l){return l.d});return '<tr><td>'+e.no+'</td><td>'+e.date+'</td><td>'+esc(e.ty)+'</td><td><details><summary>'+esc(e.desc)+'</summary>'+e.l.map(function(l){return '<div class="k">'+esc(aname(l.a))+' — مدين '+n(l.d)+' / دائن '+n(l.r)+(l.p?' ('+esc(pname(l.p))+')':'')+'</div>'}).join('')+'</details></td><td>'+n(t)+'</td><td><span class="tag">'+(e.rev?'معكوس':e.st)+'</span></td><td>'+(e.st=='مسودة'?B('ترحيل','jpost',e.id)+' '+B('حذف','jdel',e.id,'d'):(e.rev||e.ty=='عكس'?'':B('عكس القيد','jrev',e.id,'d')))+'</td></tr>'}).join('')+'</table></div>':empty('لا توجد قيود بعد.'))+'</div>';jrows()}
function aname(c){var a=S.acc.find(function(x){return x.c==c});return a?c+' '+a.n:c}
function jrows(){$('jt').innerHTML='<tr><th>الحساب</th><th>البيان</th><th>مدين</th><th>دائن</th><th></th></tr>'+jl.map(function(l,i){return '<tr><td><select onchange="jl['+i+'].a=this.value">'+accOpts('',l.a)+'</select></td><td><input value="'+esc(l.x)+'" oninput="jl['+i+'].x=this.value"></td><td><input type="number" min="0" value="'+esc(l.d)+'" oninput="jl['+i+'].d=this.value;jtot()"></td><td><input type="number" min="0" value="'+esc(l.r)+'" oninput="jl['+i+'].r=this.value;jtot()"></td><td>'+(jl.length>2?'<button class="btn d" onclick="jl.splice('+i+',1);jrows()">×</button>':'')+'</td></tr>'}).join('');jtot()}
function jtot(){var d=sum(jl,function(l){return+l.d||0}),r=sum(jl,function(l){return+l.r||0});$('jtot').innerHTML='مدين '+n(d)+' — دائن '+n(r)+' — <span class="'+(Math.abs(d-r)<0.005&&d>0?'pos':'neg')+'">'+(Math.abs(d-r)<0.005&&d>0?'القيد متوازن':'الفرق '+n(d-r))+'</span>'}
function jsave(post){var d=sum(jl,function(l){return+l.d||0}),r=sum(jl,function(l){return+l.r||0});
 if(post&&(Math.abs(d-r)>=0.005||d<=0)){alert('لا يمكن ترحيل قيد غير متوازن.');return}
 if(!val('jn').trim()){alert('اكتب البيان العام للقيد.');return}
 var e=mk(val('jn'),'',jl.map(function(l){return[l.a,l.d,l.r,'',l.x]}),'يدوي',val('jd'));if(!post)e.st='مسودة';jl=[];save();je()}
function jpost(id){var e=S.ent.find(function(x){return x.id==id}),d=sum(e.l,function(l){return l.d}),r=sum(e.l,function(l){return l.r});if(Math.abs(d-r)>=0.005){alert('القيد غير متوازن.');return}e.st='مرحّل';log('ترحيل قيد '+e.no);save();je()}
function jdel(id){S.ent=S.ent.filter(function(x){return x.id!=id});save();je()}
function jrev(id){var e=S.ent.find(function(x){return x.id==id});mk('عكس القيد رقم '+e.no+': '+e.desc,e.ref,e.l.map(function(l){return[l.a,l.r,l.d,l.p,l.x]}),'عكس');e.rev=true;save();je()}

/* السندات */
function vo(){
 var L=S.ent.filter(function(e){return e.ty.indexOf('سند')==0}).reverse().slice(0,15);
 $('app').innerHTML='<div class="box"><h2>سند قبض / صرف</h2><div class="row"><label>نوع العملية<select id="vt">'+VT.map(function(t,i){return '<option value="'+i+'">'+(t[1]=='in'?'قبض — ':'صرف — ')+t[0]+'</option>'}).join('')+'</select></label><label>وسيلة الدفع<select id="vm">'+opts(PM,function(p){return p[1]},function(p){return p[0]})+'</select></label><label>المبلغ<input id="va" type="number" min="0"></label></div><div class="row"><label>العميل / المورد<select id="vp"><option value="">—</option>'+opts(S.par,function(p){return p.id},function(p){return p.n+(p.t=='c'?' (عميل)':' (مورد)')})+'</select></label><label>حساب المصروف (لنوع مصروف)<select id="vx">'+accOpts('x')+'</select></label><label>البيان<input id="vn"></label><button class="btn" onclick="vsave()">حفظ السند</button></div></div>'+
 '<div class="box"><h2>آخر السندات</h2>'+(L.length?'<div class="tw"><table><tr><th>الرقم</th><th>التاريخ</th><th>النوع</th><th>البيان</th><th>المبلغ</th></tr>'+L.map(function(e){return '<tr><td>'+e.no+'</td><td>'+e.date+'</td><td>'+esc(e.ty)+'</td><td>'+esc(e.desc)+'</td><td>'+n(sum(e.l,function(l){return l.d}))+'</td></tr>'}).join('')+'</table></div>':empty('لا توجد سندات بعد.'))+'</div>'}
function vsave(){var t=VT[val('vt')],a=num('va'),p=val('vp'),mm=val('vm'),acc=t[2]=='X'?val('vx'):t[2];
 if(a<=0){alert('أدخل مبلغًا صحيحًا.');return}
 if(t[3]&&!p){alert('اختر العميل أو المورد لهذا النوع.');return}
 if(t[1]=='out'&&bal(mm)<a&&!confirm('رصيد الحساب المختار أقل من المبلغ. هل تريد المتابعة؟'))return;
 var d=(val('vn')||t[0])+(p?' — '+pname(p):'');
 mk(d,'',t[1]=='in'?[[mm,a,0],[acc,0,a,p]]:[[acc,a,0,p],[mm,0,a]],t[1]=='in'?'سند قبض':'سند صرف');save();vo()}

/* الفواتير: s مبيعات، b مشتريات */
function invs(k){
 var s=k=='s',its=S.itm.filter(function(i){return i.t==(s?'p':'r')}),ps=S.par.filter(function(p){return p.t==(s?'c':'s')}),L=S.inv.filter(function(x){return x.k==k}).reverse().slice(0,12);
 $('app').innerHTML='<div class="box"><h2>'+(s?'فاتورة مبيعات':'فاتورة مشتريات مواد خام')+'</h2>'+(its.length?'<div class="row"><label>'+(s?'العميل (اختياري للبيع الكامل نقدًا)':'المورد')+'<select id="ip"><option value="">—</option>'+opts(ps,function(p){return p.id},function(p){return p.n})+'</select></label><label>الصنف<select id="ii">'+opts(its,function(i){return i.id},function(i){return i.n+' (متوفر '+n(i.q)+')'})+'</select></label><label>الكمية<input id="iq" type="number" min="0" value="1"></label><label>'+(s?'سعر البيع':'سعر الشراء')+'<input id="ipr" type="number" min="0"></label><button class="btn s" onclick="iadd(\''+k+'\')">أضف</button></div>':empty('أضف أصنافًا من نوع '+(s?'«منتج»':'«مادة خام»')+' في صفحة المخزون أولًا.'))+'<div id="ic"></div></div>'+
 '<div class="box"><h2>آخر الفواتير</h2>'+(L.length?'<div class="tw"><table><tr><th>الرقم</th><th>التاريخ</th><th>الطرف</th><th>الإجمالي</th><th>المدفوع</th><th>الآجل</th></tr>'+L.map(function(x){return '<tr><td>'+x.no+'</td><td>'+x.date+'</td><td>'+esc(pname(x.p)||'نقدي')+'</td><td>'+m(x.tot)+'</td><td>'+m(x.paid)+'</td><td>'+m(x.tot-x.paid)+'</td></tr>'}).join('')+'</table></div>':empty('لا توجد فواتير بعد.'))+'</div>';if(its.length)icart(k)}
function iadd(k){var i=S.itm.find(function(x){return x.id==val('ii')}),q=num('iq'),pr=num('ipr');if(!i||q<=0)return;if(!pr)pr=k=='s'?i.pr:i.c;
 var used=sum(cart[k].filter(function(c){return c.id==i.id}),function(c){return c.q});
 if(k=='s'&&used+q>i.q){alert('المتوفر من '+i.n+' هو '+n(i.q-used)+' فقط.');return}
 cart[k].push({id:i.id,n:i.n,q:q,pr:pr});icart(k)}
function icart(k){var c=cart[k],t=sum(c,function(x){return x.q*x.pr});

function po(){var sp=S.par.filter(function(p){return p.t=='s'}),its=S.itm.filter(function(i){return i.t=='r'});
 $('app').innerHTML='<div class="box"><h2>أمر شراء جديد</h2>'+(its.length&&sp.length?'<div class="row"><label>المورد<select id="ps">'+opts(sp,function(p){return p.id},function(p){return p.n},pcs)+'</select></label><label>المادة الخام<select id="pi">'+opts(its,function(i){return i.id},function(i){return i.n})+'</select></label><label>الكمية<input id="pq" type="number" min="0"></label><label>سعر الوحدة<input id="pr2" type="number" min="0"></label><button class="btn s" onclick="poadd()">أضف</button></div>':empty('أضف موردًا ومادة خامًا أولًا.'))+(pcart.length?'<div class="tw"><table><tr><th>المادة</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>'+pcart.map(function(l){return '<tr><td>'+esc(l.n)+'</td><td>'+n(l.q)+'</td><td>'+n(l.pr)+'</td><td>'+n(l.q*l.pr)+'</td></tr>'}).join('')+'</table></div><div class="tot">الإجمالي: '+m(sum(pcart,function(l){return l.q*l.pr}))+'</div><button class="btn" onclick="posave()">حفظ أمر الشراء</button> <button class="btn d" onclick="pcart=[];po()">مسح</button>':'')+'<div class="k">أمر الشراء لا يُحدث أي قيد محاسبي. القيد والمخزون عند الاستلام فقط.</div></div>'+
 (S.po.length?S.po.slice().reverse().map(function(o){var open=o.st=='مفتوح'||o.st=='مستلم جزئيًا';return '<div class="box"><h2>'+esc(o.no)+' — '+esc(pname(o.p))+' <span class="tag">'+o.st+'</span> <span class="k">'+o.d+'</span></h2><div class="tw"><table><tr><th>المادة</th><th>المطلوب</th><th>المستلم</th><th>المتبقي</th><th>السعر</th>'+(open?'<th>استلام الآن</th>':'')+'</tr>'+o.l.map(function(l,k){return '<tr><td>'+esc(l.n)+'</td><td>'+n(l.q)+'</td><td>'+n(l.r)+'</td><td>'+n(l.q-l.r)+'</td><td>'+n(l.pr)+'</td>'+(open?'<td><input id="rq'+o.id+'_'+k+'" type="number" min="0" style="width:90px"></td>':'')+'</tr>'}).join('')+'</table></div>'+(open?B('تسجيل الاستلام','rcv',o.id,'btn')+' '+B('إغلاق الأمر','pocl',o.id,'d'):'')+'</div>'}).join(''):'<div class="box">'+empty('لا توجد أوامر شراء بعد.')+'</div>')}
function poadd(){pcs=val('ps');var i=S.itm.find(function(x){return x.id==val('pi')}),q=num('pq'),pr=num('pr2')||(i?i.c:0);if(!i||q<=0)return;pcart.push({id:i.id,n:i.n,q:q,pr:pr,r:0});po()}
function posave(){if(!pcs||!pcart.length)return;S.po.push({id:uid(),no:'أ-'+(S.po.length+1),p:pcs,d:today(),l:pcart,st:'مفتوح'});log('أمر شراء '+(S.po.length)+' للمورد '+pname(pcs));pcart=[];save();po()}
function rcv(id){var o=S.po.find(function(x){return x.id==id}),got=[],bad=false;
 o.l.forEach(function(l,k){var q=num('rq'+o.id+'_'+k);if(q<=0)return;if(q>l.q-l.r+0.0001){bad=true;alert('كمية '+l.n+' المستلمة أكبر من المتبقي ('+n(l.q-l.r)+').');return}got.push([l,q])});
 if(bad)return;if(!got.length){alert('أدخل كمية مستلمة لصنف واحد على الأقل.');return}
 var tot=0;got.forEach(function(g){var l=g[0],q=g[1],i=S.itm.find(function(x){return x.id==l.id});i.c=(i.q*i.c+q*l.pr)/(i.q+q);i.q+=q;l.r+=q;tot+=q*l.pr;S.mv.push({d:today(),t:'استلام',x:l.n+': '+n(q)+' — '+o.no})});
 mk('استلام أمر الشراء '+o.no+' — '+pname(o.p),o.no,[['1301',tot,0],['2101',0,tot,o.p]]);
 o.st=o.l.every(function(l){return l.r>=l.q-0.0001})?'مستلم':'مستلم جزئيًا';save();po()}
function pocl(id){var o=S.po.find(function(x){return x.id==id});o.st=o.l.some(function(l){return l.r>0})?'مغلق':'ملغى';log('إغلاق أمر الشراء '+o.no);save();po()}

/* حماية العمليات من الفترات المغلقة: تُلغى العملية كلها دون حفظ أي أثر */
function guard(f){return function(){var snap=JSON.stringify(S);try{return f.apply(this,arguments)}catch(e){if(String(e.message).indexOf('CLOSED:')==0){S=JSON.parse(snap);alert('هذه العملية تقع في فترة مغلقة ('+e.message.slice(7)+') ولم تُنفَّذ. أعد فتح الفترة أو غيّر التاريخ.');render()}else throw e}}}
['jsave','jpost','jrev','vsave','isave','xmake','cadd','cclr','cact','prun','ppay','sadv','wadj','rcv'].forEach(function(k){window[k]=guard(window[k])});
if(!S.cur.length)S.cur.push({c:'YER',n:'ريال يمني',rate:1,h:[]});
if(!S.wh.length)S.wh.push({id:'main',n:'المخزن الرئيسي'});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
/* ===== الربط مع Supabase ===== */
var sb=null,SYNC={},flushing=false,again=false,tmr=null,lastPull=0,lmode='in';
var MAP={acc:'accounts',ent:'entries',par:'parties',itm:'items',inv:'invoices',chk:'checks',emp:'employees',pay:'payroll',wh:'warehouses',mv:'movements',per:'periods',cur:'currencies',po:'purchase_orders',log:'logs'};
var DEF=JSON.parse(JSON.stringify({acc:S.acc,cur:S.cur,wh:S.wh}));
function rid(k,r){if(r.id)return r.id;if(k=='acc'||k=='cur')return r.c;if(k=='per')return r.m;return r._id||(r._id=uid())}
function sstat(t,bad){var e=$('sync');if(!e){e=document.createElement('div');e.id='sync';e.style.cssText='position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;padding:4px 12px;border-radius:14px;font-size:12px;background:var(--card);border:1px solid var(--bd);z-index:9';document.body.appendChild(e)}e.textContent=t;e.style.color=bad?'var(--no)':'var(--mu)'}
function syncSoon(){if(!CU)return;sstat('جارٍ الحفظ…');clearTimeout(tmr);tmr=setTimeout(flush,250)}
function save(){syncSoon()}
async function flush(){
 if(!sb||!CU)return;if(flushing){again=true;return}flushing=true;
 try{
  for(var k in MAP){var t=MAP[k],c0=SYNC[k]||(SYNC[k]={}),seen={},up=[];
   (S[k]||[]).forEach(function(r){var id=rid(k,r),j=JSON.stringify(r);seen[id]=1;if(c0[id]!==j)up.push({id:id,j:j,row:{id:id,data:r}})});
   for(var i=0;i<up.length;i+=200){var ch=up.slice(i,i+200),res=await sb.from(t).upsert(ch.map(function(x){return x.row}));if(res.error)throw res.error;ch.forEach(function(x){c0[x.id]=x.j})}
   var del=Object.keys(c0).filter(function(id){return!seen[id]});
   if(del.length){var r2=await sb.from(t).delete().in('id',del);if(r2.error)throw r2.error;del.forEach(function(id){delete c0[id]})}
  }
  sstat('تم الحفظ ✓');
 }catch(e){flushing=false;sstat('تعذر الحفظ',1);alert('تعذر حفظ التغييرات: '+(e.message||e)+'\nسيتم تحديث البيانات من الخادم.');await pull();render();return}
 flushing=false;if(again){again=false;flush()}
}
async function loadTable(t){var out=[],from=0;for(;;){var r=await sb.from(t).select('data').order('ord').range(from,from+999);if(r.error)throw r.error;out=out.concat(r.data.map(function(x){return x.data}));if(r.data.length<1000)break;from+=1000}return out}
async function pull(){
 try{sstat('جارٍ التحديث…');
  for(var k in MAP){S[k]=await loadTable(MAP[k]);var m={};S[k].forEach(function(r){m[rid(k,r)]=JSON.stringify(r)});SYNC[k]=m}
  S.seq=S.ent.reduce(function(a,e){return Math.max(a,e.no||0)},0);
  if(CU&&(CU.role=='مدير'||CU.role=='محاسب')){var seed=false;if(!S.acc.length){S.acc=DEF.acc.slice();seed=true}if(!S.cur.length){S.cur=DEF.cur.slice();seed=true}if(!S.wh.length){S.wh=DEF.wh.slice();seed=true}if(seed)flush()}
  sstat('محدّث ✓');lastPull=Date.now();
 }catch(e){sstat('تعذر التحديث',1);alert('تعذر تحميل البيانات: '+(e.message||e))}
}
async function refresh(){await pull();render()}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&CU&&!flushing&&Date.now()-lastPull>30000)refresh()});

/* الدخول */
function trErr(x){var s=String(x.message||x);if(/Invalid login/i.test(s))return 'البريد أو كلمة المرور غير صحيحة.';if(/already registered/i.test(s))return 'هذا البريد مسجل من قبل.';if(/not confirmed/i.test(s))return 'يجب تأكيد البريد الإلكتروني أولًا.';if(/rate limit/i.test(s))return 'محاولات كثيرة. انتظر قليلًا ثم أعد المحاولة.';return s}
function lmsg(t){var m=$('lm');if(m)m.textContent=t}
function login(){var up=lmode=='up';
 $('app').innerHTML='<div class="box" style="max-width:400px;margin:30px auto"><h2>'+(up?'إنشاء حساب جديد':'تسجيل الدخول')+'</h2>'+(up?'<div class="row"><label>الاسم الظاهر<input id="lnm"></label></div>':'')+'<div class="row"><label>البريد الإلكتروني<input id="lu" type="email" dir="ltr" autocomplete="username"></label></div><div class="row"><label>كلمة المرور<input id="lp" type="password" dir="ltr" autocomplete="'+(up?'new-password':'current-password')+'" onkeydown="if(event.key==\'Enter\')doLogin()"></label></div><div class="warn" id="lm"></div><button class="btn" onclick="doLogin()">'+(up?'إنشاء الحساب':'دخول')+'</button> <button class="btn s" onclick="lmode=\''+(up?'in':'up')+'\';login()">'+(up?'لدي حساب':'حساب جديد')+'</button>'+(up?'':' <button class="btn s" onclick="forgot()">نسيت كلمة المرور</button>')+'<div class="k" style="margin-top:10px">أول حساب يُنشأ يصبح مديرًا، وبقية الحسابات تنتظر تفعيل المدير.</div></div>'}
async function doLogin(){var e=val('lu').trim(),p=val('lp');if(!e||p.length<6){lmsg('أدخل البريد وكلمة مرور من 6 أحرف على الأقل.');return}
 try{
  if(lmode=='up'){var r=await sb.auth.signUp({email:e,password:p,options:{data:{name:val('lnm').trim()||e}}});if(r.error)throw r.error;if(!r.data.session){lmode='in';login();lmsg('تم إنشاء الحساب. إن وصلك بريد تأكيد فافتح الرابط ثم سجّل الدخول.');return}}
  else{var r2=await sb.auth.signInWithPassword({email:e,password:p});if(r2.error)throw r2.error}
  await start();
 }catch(x){lmsg(trErr(x))}}
async function forgot(){var e=val('lu').trim();if(!e){lmsg('اكتب بريدك أولًا.');return}var r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});lmsg(r.error?trErr(r.error):'أُرسل رابط إعادة التعيين إلى بريدك.')}
async function start(){
 var u=(await sb.auth.getUser()).data.user;if(!u){render();return}
 var r=await sb.from('profiles').select('*').eq('id',u.id).single();if(r.error){render();lmsg('تعذر قراءة الملف الشخصي: '+r.error.message);return}
 var p=r.data;
 if(!p.active){CU=null;$('nav').innerHTML='';$('app').innerHTML='<div class="box" style="max-width:420px;margin:30px auto"><h2>حسابك بانتظار التفعيل</h2><div class="empty">اطلب من المدير تفعيل حسابك وتحديد دورك، ثم سجّل الدخول من جديد.</div><button class="btn s" onclick="logout()">خروج</button></div>';return}
 CU={id:p.id,u:p.email,n:p.name,role:p.role,on:true};await pull();render()}
async function logout(){if(CU){log('تسجيل خروج');try{await flush()}catch(e){}}await sb.auth.signOut();CU=null;for(var k in MAP)S[k]=[];SYNC={};render()}

/* المستخدمون (من Supabase) */
async function usr(){
 $('app').innerHTML='<div class="box">'+empty('جارٍ التحميل…')+'</div>';
 var r=await sb.from('profiles').select('*').order('created_at');if(r.error){$('app').innerHTML='<div class="box">'+empty(esc(r.error.message))+'</div>';return}
 var scr={};TABS.forEach(function(t){scr[t[0]]=t[1]});
 $('app').innerHTML='<div class="box"><h2>المستخدمون</h2><div class="tw"><table><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>الحالة</th><th></th></tr>'+r.data.map(function(u){var me=u.id==CU.id;return '<tr><td>'+esc(u.name)+'</td><td dir="ltr">'+esc(u.email)+'</td><td><select data-i="'+u.id+'" onchange="urole(this.dataset.i,this.value)"'+(me?' disabled':'')+'>'+opts(Object.keys(ROLES),function(x){return x},function(x){return x},u.role)+'</select></td><td><span class="tag">'+(u.active?'نشط':'بانتظار التفعيل / معطل')+'</span></td><td>'+(me?'':B(u.active?'تعطيل':'تفعيل','utog',u.id+'|'+(u.active?0:1),u.active?'d':'s'))+'</td></tr>'}).join('')+'</table></div><div class="k">يسجّل الموظف حسابه من شاشة الدخول (حساب جديد)، ثم تفعّله أنت هنا وتحدد دوره. التعطيل يمنع الدخول فقط وتبقى عملياته في السجل.</div></div>'+
 '<div class="box"><h2>صلاحيات الأدوار</h2><table>'+Object.keys(ROLES).map(function(x){return '<tr><td><b>'+x+'</b></td><td>'+(ROLES[x]=='*'?'كل الشاشات وإدارة المستخدمين':ROLES[x].split(',').map(function(c){return scr[c]}).join('، '))+'</td></tr>'}).join('')+'</table><div class="k" style="margin-top:8px">الصلاحيات مطبّقة أيضًا على قاعدة البيانات (RLS)، فلا يستطيع مستخدم تجاوزها بالتحايل على الواجهة.</div></div>'+
 '<div class="box"><h2>استيراد بيانات من النسخة التجريبية</h2><div class="k">الصق نص التصدير (JSON) هنا. يُضاف إلى القاعدة ما لم يكن موجودًا.</div><textarea id="imp" rows="4" dir="ltr" style="width:100%;margin:8px 0;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:7px"></textarea><button class="btn" onclick="importData()">استيراد</button></div>'}
async function urole(id,r){var x=await sb.from('profiles').update({role:r}).eq('id',id);if(x.error)alert(x.error.message);else{log('تغيير دور مستخدم إلى '+r);syncSoon()}usr()}
async function utog(a){var p=a.split('|'),x=await sb.from('profiles').update({active:p[1]=='1'}).eq('id',p[0]);if(x.error)alert(x.error.message);else{log((p[1]=='1'?'تفعيل':'تعطيل')+' مستخدم');syncSoon()}usr()}
function importData(){var t=val('imp').trim();if(!t)return;var d;try{d=JSON.parse(t)}catch(e){alert('النص ليس JSON صحيحًا.');return}
 if(!confirm('سيتم رفع البيانات إلى قاعدة البيانات. متابعة؟'))return;var c=0;
 Object.keys(MAP).forEach(function(k){if(Array.isArray(d[k])){var have={};(S[k]||[]).forEach(function(r){have[rid(k,r)]=1});d[k].forEach(function(r){if(!have[rid(k,r)]){S[k].push(r);c++}})}});
 S.seq=S.ent.reduce(function(a,e){return Math.max(a,e.no||0)},0);save();alert('تمت إضافة '+c+' سجل.');usr()}

/* التشغيل */
(function(){
 var c=window.CFG||{};
 if(!c.SUPABASE_URL||!c.SUPABASE_ANON_KEY||!window.supabase){$('app').innerHTML='<div class="box"><h2>الإعداد غير مكتمل</h2><div class="empty">املأ عنوان المشروع ومفتاح anon في ملف config.js كما في ملف README، ثم أعد فتح الصفحة.</div></div>';return}
 sb=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);
 sb.auth.onAuthStateChange(function(ev){if(ev=='PASSWORD_RECOVERY')setTimeout(function(){var np=prompt('كلمة المرور الجديدة (6 أحرف على الأقل):');if(np&&np.length>=6)sb.auth.updateUser({password:np}).then(function(r){alert(r.error?trErr(r.error):'تم تغيير كلمة المرور.')})},300)});
 sb.auth.getSession().then(function(r){if(r.data.session)start();else render()});
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
